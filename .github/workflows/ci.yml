# `pnpm/action-setup` runs before `setup-node` so `cache: pnpm` can resolve the
# store. node24 is the floor, not a preference: the sources are .ts and run
# through Node's own type stripping, and src/cli.ts guards its entrypoint with
# `import.meta.main` — both land in 24.
#
# Actions are pinned to commit SHAs, not tags: a tag is a movable pointer, and
# these run with the repo checked out. The version each SHA belongs to is in
# the trailing comment so Dependabot can bump both together.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A push does not always produce a run: during an Actions incident the event
  # is simply dropped, and two consecutive pushes here created none while a
  # manual trigger on the same commit ran to completion. Without this, the only
  # way to ask for the matrix is to push again — which is how "the suite passed
  # locally" quietly becomes the only evidence there is, on the days the matrix
  # is the thing you most want to see.
  workflow_dispatch:

permissions:
  contents: read

# A second push supersedes the first; nothing here is worth finishing twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS is not redundant: `add`/`scan` are built on brew, the launcher is
    # POSIX sh resolving symlinks without GNU readlink, and usage.ts shells out
    # to BSD grep. Linux alone would test none of those against their real
    # userland.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      # Not `pnpm test` alone: the CLI tests that need a loopback port skip
      # themselves where binding one is not permitted (a sandboxed Mac), and
      # `node --test` exits 0 on a skip. Here they must actually run — a skip
      # would quietly stop covering every exit code the digest path decides.
      - name: Test, and fail if anything skipped
        run: |
          set +e
          out=$(pnpm test 2>&1)
          rc=$?
          printf '%s\n' "$out"
          [ "$rc" -eq 0 ] || exit "$rc"
          skipped=$(sed -n 's/^ℹ skipped //p' <<<"$out" | tail -1)
          if [ "${skipped:-0}" != 0 ]; then
            echo "::error::$skipped test(s) skipped in CI, where they must run" >&2
            exit 1
          fi
