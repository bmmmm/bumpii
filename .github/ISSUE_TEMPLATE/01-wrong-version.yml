name: Wrong installed version
description: bumpii reports the wrong version for a tool, or says "not installed" when it is
labels: [bug, version-probe, triage]
body:
  - type: markdown
    attributes:
      value: |
        Every entry carries a hand-written or generated regex against a
        binary's own output, so this is the most common thing to go wrong.
        The two questions below decide whether the fix belongs in bumpii or
        in your config.

  - type: input
    id: tool
    attributes:
      label: Tool
      description: The `name` of the entry in your config.
      placeholder: gh
    validations:
      required: true

  - type: dropdown
    id: origin
    attributes:
      label: Where did this entry come from?
      description: >
        This is the routing question. An entry `bumpii add` generated and got
        wrong is a bug in the probe logic; one written by hand is usually a
        regex that needs adjusting — and if it is, the fix is a doc or an
        error-message improvement rather than a code change.
      options:
        # A GitHub dropdown displays its first entry before anything is
        # picked, so "Not sure" leads: it is the one answer that stays true
        # for a reporter who never opened the menu.
        - Not sure
        - Generated by `bumpii add`
        - Written by hand
        - Generated by `bumpii add`, then edited by hand
    validations:
      required: true

  - type: textarea
    id: entry
    attributes:
      label: The config entry
      description: The tool's object from `~/.config/bumpii/tools.json`.
      render: json
      placeholder: |
        {
          "name": "gh",
          "source": "github:cli/cli",
          "version": { "cmd": ["gh", "--version"], "match": "gh version ([0-9][0-9.]*)" },
          "update": "brew upgrade gh"
        }
    validations:
      required: true

  - type: textarea
    id: raw-output
    attributes:
      label: What the binary actually prints
      description: >
        Run the entry's `version.cmd` yourself and paste everything, including
        stderr — `gh --version 2>&1`. This is what the regex has to match, so
        without it there is nothing to compare against. Do not retype it:
        trailing spaces, tabs and colour codes all matter here.
      render: shell
      placeholder: |
        $ gh --version 2>&1
        gh version 2.96.0 (2026-07-14)
        https://github.com/cli/cli/releases/tag/v2.96.0
    validations:
      required: true

  - type: textarea
    id: bumpii-output
    attributes:
      label: What bumpii says
      description: Output of `bumpii --no-judge --only <tool>`.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: bumpii version
      description: The commit you are on — `git -C <checkout> rev-parse --short HEAD`.
    validations:
      required: true
