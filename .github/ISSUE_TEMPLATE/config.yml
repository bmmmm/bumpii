# blank_issues_enabled: false does not remove the "Blank issue" option — it
# restricts it to maintainers and labels it "(Maintainers only)" in the
# chooser.
blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/bmmmm/bumpii/security/policy
    about: Do not open a public issue. Report privately — see SECURITY.md.
  - name: Usage question or setup help
    url: https://github.com/bmmmm/bumpii#readme
    about: Install, config format, source forms and engine setup are documented there.
